name: Build wheels (cibuildwheel) for Linux and macOS (x86_64 + aarch64)

on:
  push:
    branches: [main, master]
    paths:
      - '**/*.pyx'
      - '**/*.rs'
      - '.github/workflows/cibuildwheel.yml'
  pull_request:
    paths:
      - '**/*.pyx'
      - '**/*.rs'
      - '**/Cargo.toml'
      - 'build-configs/pyproject-AIM-*.toml'
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Pre-generate Cython .c files ONCE
  # Avoids re-cythonizing inside every container
  # ─────────────────────────────────────────────
  cythonize:
    name: Pre-generate Cython C files
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Cython + numpy
        run: pip install "cython>=3.0" "numpy>=2.1.0"

      - name: Cythonize .pyx files
        run: |
          cython --version
          find src/ -name "*.pyx" | while read f; do
            echo "Cythonizing $f..."
            cython "$f"
          done

      - name: Upload Cython C files
        uses: actions/upload-artifact@v4
        with:
          name: cython-c-files
          path: src/*.c
          retention-days: 1

  # ─────────────────────────────────────────────
  # JOB 2: Build Rust extension wheels
  # One job per OS, builds all Python versions
  # in a single maturin invocation
  # ─────────────────────────────────────────────
  build-rust-wheels:
    name: Build Rust wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Fix Windows long-path / linker issue
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --system core.longpaths true
          Remove-Item -Recurse -Force "D:\a\rust-target" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "D:\a\rust-target" | Out-Null

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./rust_optimization_ -> target"

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install maturin
        run: pip install maturin

      - name: Build Rust wheels (all Python versions)
        working-directory: ./rust_optimization_
        shell: bash
        run: |
          if sccache --start-server 2>/dev/null; then
            export RUSTC_WRAPPER=sccache
            export SCCACHE_GHA_ENABLED=true
            echo "✅ sccache enabled"
          else
            echo "⚠️ sccache unavailable, building without cache"
          fi

          if [[ "$RUNNER_OS" == "Windows" ]]; then
            export CARGO_TARGET_DIR='D:/a/rust-target'
          else
            export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/rust-target"
          fi

          mkdir -p "$CARGO_TARGET_DIR"

          maturin build --release \
            --target-dir "$CARGO_TARGET_DIR" \
            --interpreter python3.10 python3.11 python3.12

      - name: sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true

      - name: Copy opt-README into Rust wheels output
        shell: bash
        run: |
          if [ -f "readme-docs/opt-README.md" ]; then
            if [[ "$RUNNER_OS" == "Windows" ]]; then
              cp readme-docs/opt-README.md "D:/a/rust-target/wheels/opt-README.md"
            else
              cp readme-docs/opt-README.md "$GITHUB_WORKSPACE/rust_optimization_/target/wheels/opt-README.md"
            fi
            echo "✅ opt-README.md bundled with Rust wheels"
          else
            echo "⚠️ readme-docs/opt-README.md not found, skipping"
          fi

      - name: Upload Rust wheels
        uses: actions/upload-artifact@v4
        with:
          name: rust-wheels-${{ matrix.os }}
          path: |
            D:/a/rust-target/wheels/*.whl
            D:/a/rust-target/wheels/opt-README.md
            rust_optimization_/target/wheels/*.whl
            rust_optimization_/target/wheels/opt-README.md
          if-no-files-found: ignore
          retention-days: 7

  # ─────────────────────────────────────────────
  # JOB 3a: Linux x86_64 — native runner
  # Uses pyproject-AIM-2.toml (x86_64 manylinux)
  # and pyproject-AIM-3.toml (x86_64 musllinux)
  # ─────────────────────────────────────────────
  build-linux-x86_64:
    name: Build Linux wheels (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 500
    needs: [cythonize, build-rust-wheels]
    strategy:
      fail-fast: false
      matrix:
        include:
          - aim: AIM-2
            toml: build-configs/pyproject-AIM-2.toml
          - aim: AIM-3
            toml: build-configs/pyproject-AIM-3.toml
    env:
      CIBW_PLATFORM: linux
      CIBW_ARCHS: x86_64
      CIBW_BUILD: "cp310-* cp311-* cp312-*"
      CIBW_BUILD_FRONTEND: "build[uv]"
      CIBW_CONTAINER_ENGINE: "docker; create_args: -v /tmp/rust-wheels:/host/rust-wheels:ro"
      CIBW_ENVIRONMENT: >
        RUST_WHEEL_DIR=/host/rust-wheels
      CIBW_BEFORE_ALL_LINUX: |
        set -euo pipefail
        echo "Detecting package manager..."
        if command -v yum >/dev/null 2>&1; then
          echo "yum detected — installing manylinux deps"
          yum install -y epel-release || true
          yum install -y openblas-devel blas-devel lapack-devel || true
        elif command -v apk >/dev/null 2>&1; then
          echo "apk detected — installing musllinux deps"
          apk add --no-cache openblas-dev lapack-dev build-base gfortran || true
        fi
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cibuildwheel
        run: python -m pip install --upgrade pip cibuildwheel

      - name: Download Rust wheels artifact
        uses: actions/download-artifact@v4
        with:
          pattern: rust-wheels-*
          path: /tmp/rust-w
