name: Nightly Compatibility

on:
  schedule:
    - cron: '0 2 * * *'  # every day at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly-compatibility:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install OS build deps (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev

      - name: Upgrade pip and install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel Cython
          python -m pip install --upgrade --upgrade-strategy eager \
            numpy \
            scipy \
            scikit-learn \
            pandas \
            joblib \
            cryptography \
            aiohttp \
            psutil \
            pytest \
            pytest-cov \
            pytest-xdist \
            AbstractIntegratedModule

      - name: Build Cython extensions (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          python scripts/linux_setup.py build_ext --inplace

      - name: Skip Cython build on Windows
        if: runner.os == 'Windows'
        run: |
          echo "Skipping Cython build on Windows because the repository currently uses a POSIX-only build script."

      - name: Run smoke import checks (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          python -c "import AbstractIntegratedModule; print('Import OK')"
          python -c "import AbstractOptimizedModules; print('Optimized import OK')"

      - name: Skip smoke checks on Windows
        if: runner.os == 'Windows'
        run: |
          echo "Skipping import smoke checks on Windows until the project is cross-platform."

      - name: Run test suite (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          pytest tests/ -v -n auto --maxfail=1
          
      - name: Run Python script
        env:
           PYTHONIOENCODING: utf-8
        run: python tests/daily_test_import.py
