name: Tests Compatibility

on:
  push:
    branches: [ main ]
    paths:
      - 'src/*.pyx'
      - 'requirements.txt'
      - 'scripts/linux_setup.py'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/*.pyx'
      - 'requirements.txt'
      - 'scripts/linux_setup.py'
      - '.github/workflows/test.yml'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']
        exclude:
          # Reduce matrix size - test Python 3.9 only on Linux
          - os: windows-latest
            python-version: '3.9'
          - os: macos-latest
            python-version: '3.9'

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev

      # macOS: no system dependency step needed.
      # The runner already ships with Xcode Command Line Tools (clang),
      # which is what Cython/setuptools use to compile extensions.
      # (The old `brew install build-essential` failed because that is an
      # apt package and does not exist in Homebrew.)

      - name: Upgrade pip
        run: python -m pip install --upgrade pip wheel setuptools

      - name: Install dependencies
        run: |
          pip install Cython numpy scikit-learn scipy pandas joblib cryptography aiohttp psutil
          pip install pytest pytest-cov pytest-xdist

      - name: Compile Cython extensions
        run: python scripts/linux_setup.py build_ext --inplace

      - name: Run tests with pytest
        run: pytest tests/ -v --cov=AbstractIntegratedModule --cov=AbstractOptimizedModules --cov-report=xml --cov-report=html -n auto
        continue-on-error: true

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
